<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Orbit</title>
<style>
html,body{margin:0;height:100%;background:#05060a;overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8ecf4;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{display:block;cursor:crosshair;touch-action:none}
#hud{position:fixed;top:18px;left:20px;font-size:14px;letter-spacing:.04em;pointer-events:none;opacity:.9;line-height:1.6}
#reset{pointer-events:auto;margin-left:10px;padding:3px 9px;font:inherit;font-size:12px;color:inherit;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:6px;opacity:.7;cursor:pointer}
#reset:hover{opacity:1}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:20px}
#msg>div{background:rgba(5,6,10,.78);border:1px solid rgba(255,255,255,.08);padding:24px 32px;border-radius:12px;max-width:360px;line-height:1.5}
#msg h1{margin:0 0 10px;font-size:28px;font-weight:600;letter-spacing:.12em}
#msg p{margin:6px 0;font-size:14px;opacity:.85}
#msg .go{margin-top:14px;opacity:.6;font-size:13px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Level <b id="lv"></b> <button id="reset" title="Start again from level 1">↺ restart</button></div>
<div id="msg"></div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hudEl = document.getElementById('hud');
const msgEl = document.getElementById('msg');
const lvEl = document.getElementById('lv');

// ---------- view: world is roughly -500..500 on the shorter screen axis ----------
let W, H, S, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  S = Math.min(W, H) / 1000;
  clampView();
}
// camera: pinch / wheel zoom (1x..5x) and pan. Only affects drawing and input;
// the off-screen fail boundary is always the unzoomed screen.
let zoom = 1, camX = 0, camY = 0;
const ZMAX = 5;
const toScreen = (x, y) => [W / 2 + (x - camX) * S * zoom, H / 2 + (y - camY) * S * zoom];
const toWorld = (sx, sy) => [(sx - W / 2) / (S * zoom) + camX, (sy - H / 2) / (S * zoom) + camY];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function clampView() {
  zoom = clamp(zoom, 1, ZMAX);
  const hw = W / 2 / S * (1 - 1 / zoom), hh = H / 2 / S * (1 - 1 / zoom);
  camX = clamp(camX, -hw, hw); camY = clamp(camY, -hh, hh);
}
function zoomAt(sx, sy, f) {
  const [wx, wy] = toWorld(sx, sy);
  zoom = clamp(zoom * f, 1, ZMAX);
  camX = wx - (sx - W / 2) / (S * zoom); camY = wy - (sy - H / 2) / (S * zoom);
  clampView();
}
function resetView() { zoom = 1; camX = 0; camY = 0; }
addEventListener('resize', resize); resize();

const stars = Array.from({ length: 200 }, () => ({
  x: Math.random(), y: Math.random(), r: Math.random() * 1.1 + 0.2, a: Math.random() * 0.5 + 0.15, tw: Math.random() * 6
}));
for (const s of stars) s.k = 0.15 + 0.35 * (s.r - 0.2) / 1.1;   // parallax depth: bigger stars feel nearer, move more

// ---------- tuning ----------
const K = 3200;          // planet gravity = K * radius^2
const SPEED = 1.25;      // simulation speed-up (same orbits, just faster)
const TARGET = 15;       // seconds to clear a level
const ESCAPE = 1300;     // distance from centre where the moon is lost
const MOON_R = 7;
const LAUNCH_K = 2.2;    // drag distance -> launch speed
const MAX_V = 700;
const PREVIEW_T = 10; // seconds of trajectory shown while aiming
const HUES = [205, 25, 145, 280, 48, 340];

// planets: [x, y, radius]; zone: [x, y, radius] where the moon must be launched from
const LAYOUTS = [
  { ps: [[0, 0, 55]], zone: [-300, 0, 110] },
  { ps: [[-60, 0, 60], [235, 0, 18]], zone: [0, -330, 90] },
  { ps: [[-190, 0, 45], [190, 0, 45]], zone: [0, 300, 110] },
  { ps: [[0, -170, 40], [-150, 110, 40], [150, 110, 40]], zone: [0, 330, 100] },
  { ps: [[0, 0, 50], [-290, -200, 24], [290, 200, 24]], zone: [-300, 250, 100] },
  { ps: [[-170, -170, 32], [170, -170, 32], [-170, 170, 32], [170, 170, 32]], zone: [0, 340, 90] },
];

function makeLevel(n) {
  let ps, z;
  if (n <= LAYOUTS.length) ({ ps, zone: z } = LAYOUTS[n - 1]);
  else {
    const count = Math.min(2 + Math.floor((n - LAYOUTS.length + 1) / 2), 6);
    ps = []; let tries = 0;
    while (ps.length < count && tries++ < 800) {
      const r = 20 + Math.random() * 40, a = Math.random() * Math.PI * 2, d = Math.random() * 320;
      const x = Math.cos(a) * d, y = Math.sin(a) * d;
      if (ps.every(p => Math.hypot(p[0] - x, p[1] - y) > p[2] + r + 100)) ps.push([x, y, r]);
    }
    // launch zone: shrinks with level, kept clear of planets and inside the visible area on any screen
    // big and out near the edge early on; small and allowed anywhere (e.g. between planets) from ~level 20
    const zr = Math.max(40, 100 - (n - LAYOUTS.length - 1) * 4);
    const minD = n < 20 ? 250 : 0;
    for (let i = 0; i < 800 && !z; i++) {
      const x = (Math.random() * 2 - 1) * (400 - zr), y = (Math.random() * 2 - 1) * (400 - zr);
      if (Math.hypot(x, y) > minD && ps.every(p => Math.hypot(p[0] - x, p[1] - y) > p[2] + zr + 50)) z = [x, y, zr];
    }
    if (!z) z = [0, 400 - zr, zr];
  }
  zone = { x: z[0], y: z[1], r: z[2] };
  return ps.map((p, i) => ({ x: p[0], y: p[1], r: p[2], gm: K * p[2] * p[2], hue: HUES[(i + n - 1) % HUES.length] }));
}

function accel(x, y) {
  let ax = 0, ay = 0;
  for (const p of planets) {
    const dx = p.x - x, dy = p.y - y, d2 = dx * dx + dy * dy, d = Math.sqrt(d2), f = p.gm / (d2 * d);
    ax += dx * f; ay += dy * f;
  }
  return [ax, ay];
}
function offScreen(x, y) {
  const sx = W / 2 + x * S, sy = H / 2 + y * S, r = Math.max(MOON_R * S, 3);   // unzoomed view
  return sx < -r || sy < -r || sx > W + r || sy > H + r;
}
function hitPlanet(x, y, pad = MOON_R) {
  for (const p of planets) if (Math.hypot(p.x - x, p.y - y) < p.r + pad) return p;
  return null;
}

// ---------- game state ----------
function loadLevel() { try { return Math.max(1, parseInt(localStorage.getItem('orbit.level'), 10) || 1); } catch (e) { return 1; } }
function saveLevel(n) { try { localStorage.setItem('orbit.level', n); } catch (e) {} }
let zone = null, zoneFlash = 0;
let level = loadLevel(), planets = makeLevel(level);
let state = 'title';     // title | aim | flying | crashed | cleared
let lastLaunch = null;   // press + release points of the previous attempt on this level
let moon = null, trail = [], particles = [], t = 0, drag = null, pauseT = 0, clock = 0;

function showMsg(html) { msgEl.innerHTML = html ? '<div>' + html + '</div>' : ''; }
function title() {
  showMsg('<h1>ORBIT</h1><p>Press inside the launch circle, drag back, and let go to launch your moon.</p>' +
    '<p>Keep it moving without hitting a planet or letting it leave the screen.</p>' +
    '<p>Last ' + TARGET + ' seconds to pass. Fail and you just retry the level.</p><p class="go">' + (level > 1 ? 'Click to continue level ' + level : 'Click to start') + '</p>');
}
function nextLevel() {
  level++; planets = makeLevel(level); saveLevel(level);
  lastLaunch = null; moon = null; trail = []; t = 0; particles = []; resetView();
  state = 'aim'; showMsg('');
}
document.getElementById('reset').addEventListener('click', () => {
  if (level === 1 || !confirm('Start again from level 1?')) return;
  level = 1; planets = makeLevel(1); saveLevel(1);
  lastLaunch = null; moon = null; drag = null; trail = []; t = 0; particles = []; resetView();
  state = 'title'; title();
});
function boom(x, y, hue) {
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 220;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6 + Math.random() * 0.6, max: 1.2, hue });
  }
}
function loseMoon(text) {
  moon = null; state = 'crashed'; pauseT = 1.3;
  showMsg('<h1>FAIL</h1><p>' + text + '</p>');
}

// ---------- input ----------
function pt(e) { return toWorld(e.clientX, e.clientY); }
const ptrs = new Map();   // active pointers (screen coords)
let pinch = null, pan = null;
function pinchInfo() {
  const [a, b] = [...ptrs.values()];
  return { mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)) };
}
cv.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cv.setPointerCapture(e.pointerId);
  if (ptrs.size === 2) { drag = null; pan = null; pinch = pinchInfo(); return; }   // second finger: pinch, cancels any aim
  if (ptrs.size > 2) return;
  if (state === 'title') { state = 'aim'; showMsg(''); return; }
  if (state === 'cleared') { nextLevel(); return; }
  const startPan = () => { if (zoom > 1) pan = { x: e.clientX, y: e.clientY }; };
  if (state !== 'aim') { startPan(); return; }
  let [x, y] = pt(e);
  // must start in the launch zone; a near miss (within ~24px) snaps to its edge
  const zd = Math.hypot(x - zone.x, y - zone.y);
  if (zd > zone.r + 24 / (S * zoom)) { if (zoom > 1) startPan(); else zoneFlash = 0.5; return; }
  if (zd > zone.r) { x = zone.x + (x - zone.x) * zone.r / zd; y = zone.y + (y - zone.y) * zone.r / zd; }
  if (hitPlanet(x, y, MOON_R + 4)) return;
  drag = { x, y, cx: x, cy: y, sx: e.clientX, sy: e.clientY };
});
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (pinch && ptrs.size >= 2) {
    const n = pinchInfo();
    camX -= (n.mx - pinch.mx) / (S * zoom); camY -= (n.my - pinch.my) / (S * zoom);
    zoomAt(n.mx, n.my, n.d / pinch.d);
    pinch = n; return;
  }
  if (pan) {
    camX -= (e.clientX - pan.x) / (S * zoom); camY -= (e.clientY - pan.y) / (S * zoom);
    clampView(); pan.x = e.clientX; pan.y = e.clientY; return;
  }
  if (!drag) return;
  [drag.cx, drag.cy] = pt(e); drag.sx = e.clientX; drag.sy = e.clientY;
});
// Cancel spot: appears bottom-centre while dragging. Release on it to cancel the launch.
function cancelZone() { return { x: W / 2, y: H - 70, r: 34 }; }
function overCancel() {
  if (!drag) return false;
  const z = cancelZone();
  return Math.hypot(drag.sx - z.x, drag.sy - z.y) < z.r + 6;
}
function endDrag() {
  if (!drag) return;
  const dx = drag.x - drag.cx, dy = drag.y - drag.cy, len = Math.hypot(dx, dy);
  if (len > 6 && !overCancel()) {
    let vx = dx * LAUNCH_K, vy = dy * LAUNCH_K;
    const v = Math.hypot(vx, vy);
    if (v > MAX_V) { vx *= MAX_V / v; vy *= MAX_V / v; }
    lastLaunch = { x: drag.x, y: drag.y, cx: drag.cx, cy: drag.cy };
    simAcc = 0;
    moon = { x: drag.x, y: drag.y, vx, vy };
    trail = []; t = 0; state = 'flying';
  }
  drag = null;
}
function pointerEnd(e) {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0) pan = null;
}
cv.addEventListener('pointerup', e => { pointerEnd(e); endDrag(); });
cv.addEventListener('pointercancel', e => { pointerEnd(e); drag = null; });
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

function launchVel() {
  let vx = (drag.x - drag.cx) * LAUNCH_K, vy = (drag.y - drag.cy) * LAUNCH_K;
  const v = Math.hypot(vx, vy);
  if (v > MAX_V) { vx *= MAX_V / v; vy *= MAX_V / v; }
  return [vx, vy];
}

// ---------- simulation ----------
// One fixed-step integrator shared by the flight and the preview, so the preview is exact.
const H_STEP = 1 / 600;
let simAcc = 0;
function physStep(b) {
  const [ax, ay] = accel(b.x, b.y);
  b.vx += ax * H_STEP; b.vy += ay * H_STEP;
  b.x += b.vx * H_STEP; b.y += b.vy * H_STEP;
}
// returns 'hit' (with planet), 'off', or null
function stepMoon(dt) {
  simAcc += dt;
  while (simAcc >= H_STEP) {
    simAcc -= H_STEP;
    physStep(moon);
    const p = hitPlanet(moon.x, moon.y);
    if (p) return { kind: 'hit', p };
    if (offScreen(moon.x, moon.y)) return { kind: 'off' };
  }
  return null;
}

function update(dt) {
  clock += dt;
  zoneFlash = Math.max(0, zoneFlash - dt);
  if (moon && (state === 'flying' || state === 'cleared')) {
    const r = stepMoon(dt * SPEED);
    if (r && r.kind === 'hit') {
      boom(moon.x, moon.y, r.p.hue);
      if (state === 'flying') loseMoon('Crashed into a planet');
      else moon = null;
    } else if (r && r.kind === 'off') {
      if (state === 'flying') loseMoon('Flew off the screen');
      else moon = null;
    } else {
      trail.push([moon.x, moon.y]);
      if (trail.length > 110) trail.shift();
      if (state === 'flying') {
        t += dt;
        if (t >= TARGET) {
          state = 'cleared';
          showMsg('<h1>PASS</h1><p>Level ' + level + ' cleared</p><p class="go">Click for level ' + (level + 1) + '</p>');
        }
      }
    }
  }
  if (state === 'crashed') {
    pauseT -= dt;
    if (pauseT <= 0) { state = 'aim'; trail = []; t = 0; showMsg(''); }
  }
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.98; q.vy *= 0.98; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
}

// ---------- drawing ----------
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);

  // stars: parallax, each zooms/pans a fraction (s.k) of what the planets do, so they read as far behind
  for (const s of stars) {
    const zs = 1 + (zoom - 1) * s.k;
    const sx = W / 2 + ((s.x - 0.5) * W - camX * S * s.k) * zs, sy = H / 2 + ((s.y - 0.5) * H - camY * S * s.k) * zs;
    if (sx < -4 || sy < -4 || sx > W + 4 || sy > H + 4) continue;
    ctx.globalAlpha = s.a * (0.75 + 0.25 * Math.sin(clock * 1.3 + s.tw));
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(sx, sy, s.r * Math.sqrt(zs), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // big faint countdown behind everything
  const prog = (state === 'flying' || state === 'cleared') ? Math.min(t / TARGET, 1) : 0;
  if (state !== 'title') {
    const left = state === 'cleared' ? 0 : Math.ceil(TARGET - (state === 'flying' ? t : 0));
    const hue = state === 'cleared' ? 140 : 205 - 65 * prog;
    // last 5 seconds: the background pulses on each tick, harder as it gets closer
    let pulse = 0;
    if (state === 'flying' && left <= 5) {
      const rem = TARGET - t, frac = rem - Math.floor(rem);   // ~1 just after a tick, falls to 0
      pulse = Math.pow(frac, 3) * (0.6 + 0.4 * (5 - left) / 4);
      ctx.fillStyle = `hsla(${hue},75%,55%,${0.16 * pulse})`;
      ctx.fillRect(0, 0, W, H);
    }
    const fs = Math.min(W, H) * 0.42 * (1 + 0.08 * pulse);
    ctx.font = `600 ${fs}px system-ui,-apple-system,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const base = state === 'flying' || state === 'cleared' ? 0.09 : 0.05;
    ctx.fillStyle = `hsla(${hue},70%,70%,${base + 0.22 * pulse})`;
    ctx.fillText(state === 'cleared' ? '✓' : String(left), W / 2, H / 2 + fs * 0.04);
    ctx.textBaseline = 'alphabetic';
  }

  // planets
  for (const p of planets) {
    const [sx, sy] = toScreen(p.x, p.y), r = p.r * S * zoom;
    const halo = ctx.createRadialGradient(sx, sy, r, sx, sy, r * 3.2);
    halo.addColorStop(0, `hsla(${p.hue},70%,60%,0.14)`); halo.addColorStop(1, `hsla(${p.hue},70%,60%,0)`);
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(sx, sy, r * 3.2, 0, 7); ctx.fill();
    const g = ctx.createRadialGradient(sx - r * 0.35, sy - r * 0.35, r * 0.1, sx, sy, r);
    g.addColorStop(0, `hsl(${p.hue},65%,68%)`); g.addColorStop(1, `hsl(${p.hue},55%,22%)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.fill();
  }

  // launch zone
  if (state === 'aim' || state === 'crashed') {
    const [zx, zy] = toScreen(zone.x, zone.y), zr = zone.r * S * zoom, f = zoneFlash / 0.5;
    const breathe = drag ? 0 : 0.5 + 0.5 * Math.sin(clock * 3);
    ctx.fillStyle = `rgba(127,209,255,${0.05 + 0.03 * breathe + 0.12 * f})`;
    ctx.strokeStyle = `rgba(127,209,255,${0.35 + 0.2 * breathe + 0.45 * f})`;
    ctx.lineWidth = 1.5 + 1.5 * f; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.arc(zx, zy, zr, 0, 7); ctx.fill(); ctx.stroke();
    ctx.setLineDash([]);
  }

  // trail
  for (let i = 1; i < trail.length; i++) {
    const [ax, ay] = toScreen(...trail[i - 1]), [bx, by] = toScreen(...trail[i]);
    ctx.strokeStyle = `rgba(200,225,255,${(i / trail.length) * 0.55})`;
    ctx.lineWidth = Math.max(1, 2.2 * S * zoom * (i / trail.length) * 1.4);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  }

  // ghost of the previous launch on this level
  if (lastLaunch && (state === 'aim' || state === 'crashed')) {
    const [ax, ay] = toScreen(lastLaunch.x, lastLaunch.y), [bx, by] = toScreen(lastLaunch.cx, lastLaunch.cy);
    ctx.setLineDash([4, 5]);
    ctx.strokeStyle = 'rgba(255,200,120,0.35)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,200,120,0.55)';
    ctx.beginPath(); ctx.arc(ax, ay, 5, 0, 7); ctx.fill();          // press point (where the moon started)
    ctx.strokeStyle = 'rgba(255,200,120,0.55)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(bx, by, 6, 0, 7); ctx.stroke();        // release point
  }

  // aiming
  if (drag) {
    const z = cancelZone(), over = overCancel();
    ctx.fillStyle = over ? 'rgba(255,90,90,0.35)' : 'rgba(255,255,255,0.06)';
    ctx.strokeStyle = over ? 'rgba(255,120,120,0.9)' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, 7); ctx.fill(); ctx.stroke();
    const k = z.r * 0.35;
    ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(z.x - k, z.y - k); ctx.lineTo(z.x + k, z.y + k);
    ctx.moveTo(z.x + k, z.y - k); ctx.lineTo(z.x - k, z.y + k); ctx.stroke();
    ctx.fillStyle = 'rgba(232,236,244,0.45)'; ctx.font = '12px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('drop here to cancel', z.x, z.y + z.r + 16);
  }
  if (drag && !overCancel()) {
    const [mx, my] = toScreen(drag.x, drag.y), [cx, cy] = toScreen(drag.cx, drag.cy);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(cx, cy); ctx.stroke();
    // short trajectory preview
    const [lvx, lvy] = launchVel(), b = { x: drag.x, y: drag.y, vx: lvx, vy: lvy };
    const steps = Math.round(PREVIEW_T / H_STEP);
    ctx.fillStyle = 'rgba(127,209,255,0.7)';
    for (let i = 0; i < steps; i++) {
      physStep(b);
      if (hitPlanet(b.x, b.y) || offScreen(b.x, b.y)) break;
      if (i % 25 === 0) {
        const [px, py] = toScreen(b.x, b.y);
        ctx.globalAlpha = 0.9 - 0.75 * (i / steps);
        ctx.beginPath(); ctx.arc(px, py, 1.6, 0, 7); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    drawMoon(drag.x, drag.y);
  }

  if (moon) drawMoon(moon.x, moon.y);

  for (const q of particles) {
    const [sx, sy] = toScreen(q.x, q.y);
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = `hsl(${q.hue},80%,75%)`;
    ctx.beginPath(); ctx.arc(sx, sy, 2, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (state === 'aim' && !drag) {
    ctx.fillStyle = 'rgba(232,236,244,0.45)'; ctx.font = '13px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Press inside the circle, drag back, release to launch', W / 2, H - 24);
  }

  // HUD
  if (lvEl.textContent !== String(level)) lvEl.textContent = level;
}

function drawMoon(x, y) {
  const [sx, sy] = toScreen(x, y), r = Math.max(MOON_R * S * zoom, 3);
  const g = ctx.createRadialGradient(sx - r * 0.4, sy - r * 0.4, r * 0.1, sx, sy, r);
  g.addColorStop(0, '#fbf8ee'); g.addColorStop(1, '#8d8a80');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.fill();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
title();
requestAnimationFrame(frame);
</script>
</body>
</html>
